<html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ERP demo</title>
<style>
/* ERP page styles. Same colour logic as the CRM page, own file; system fonts only (no font CDN). */
:root{
  --bg:#EEF2F4; --surface:#FFFFFF; --surface2:#F6F8F9; --ink:#14212B; --muted:#5C6B77; --line:#D8E0E5;
  --accent:#2F5D8A; --accent-ink:#FFFFFF; --accent-soft:#E1EAF3;
  --good:#1E8E5A; --warn:#B7791F; --bad:#C0392B; --warn-soft:#FBF0D9; --bad-soft:#F9E1DE; --good-soft:#DCF2E6;
  --shadow:0 1px 2px rgba(20,33,43,.08),0 4px 14px rgba(20,33,43,.06);
  --font:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F171D; --surface:#17222A; --surface2:#1D2B34; --ink:#E6EDF1; --muted:#93A4B0; --line:#2B3B46;
  --accent:#7FA8D1; --accent-ink:#0A1622; --accent-soft:#1B2E40;
  --good:#4CC38A; --warn:#E0A94A; --bad:#EE7A6C; --warn-soft:#3A2F17; --bad-soft:#40201C; --good-soft:#153427;

:root[data-theme="dark"]{

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45}
h1,h2,h3{margin:0;font-weight:600}
h1{font-size:20px} h2{font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.link{border:0;background:none;color:var(--accent);padding:4px 6px}
button:disabled{opacity:.55;cursor:default}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 9px}
input[type=checkbox]{width:auto}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
label.check{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px}
.muted{color:var(--muted)}
.msg{margin:10px 0;padding:8px 10px;border-radius:8px;background:var(--warn-soft)}
.msg.bad{background:var(--bad-soft)} .msg.good{background:var(--good-soft)}
.msg:empty{display:none}
.center{max-width:380px;margin:12vh auto 0;padding:0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow)}
.card h1{margin-bottom:6px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.grow{flex:1}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.top .brand{font-weight:600}
.top nav{display:flex;gap:4px;flex-wrap:wrap}
.top nav a{padding:6px 10px;border-radius:8px;color:var(--ink);text-decoration:none}
.top nav a.on{background:var(--accent-soft);color:var(--accent)}
.main{padding:16px;max-width:1200px;margin:0 auto}
.tabs{display:flex;gap:4px;margin:0 0 12px;flex-wrap:wrap}
.tabs a{padding:6px 10px;border-radius:8px;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface)}
.tabs a.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
tr.click{cursor:pointer} tr.click:hover{background:var(--surface2)}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;background:var(--surface2);border:1px solid var(--line)}
.badge.good{background:var(--good-soft)} .badge.warn{background:var(--warn-soft)} .badge.bad{background:var(--bad-soft)}
.empty{padding:24px;text-align:center;color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(10,20,30,.35);z-index:10}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:11;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.drawer header{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.drawer .body{flex:1;overflow:auto;padding:4px 16px 16px}
.drawer footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line)}
.modal{position:fixed;left:50%;top:30%;transform:translateX(-50%);width:min(420px,calc(100% - 32px));z-index:21;background:var(--surface);border-radius:12px;padding:18px;box-shadow:var(--shadow)}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,30,.35);z-index:20}
.problems{margin:6px 0 0 18px;padding:0}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:30}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{display:flex;gap:6px;align-items:center;margin:0;padding:4px 8px;border:1px solid var(--line);border-radius:999px;color:var(--ink);font-size:13px}
/* stock (T14) */
.neg{color:var(--bad);font-weight:600}
.dline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.dline .dl-item{flex:1 1 220px;min-width:0}
.dline .dl-item .dl-name{display:block;font-size:12px;margin-top:2px}
.dline input.dl-qty,.dline input.dl-price,.dline input.dl-disc{width:96px}
.dline input.dl-ref{width:140px}
.dline .dl-amt{min-width:80px;text-align:right}
.dline input.rc-reason{flex:1 1 180px;min-width:0}
.dline select.dl-cat{flex:1 1 200px;min-width:0;width:auto}
.dline input.dl-desc{flex:1 1 160px;min-width:0}
.dline input.dl-net{width:96px}
.dline select.dl-vat{width:auto}
.drawer footer{flex-wrap:wrap}
@media (max-width:600px){.top{padding:8px 12px}.main{padding:12px}
  .dline input.dl-qty,.dline input.dl-price,.dline input.dl-disc{width:calc(33% - 6px)}}
</style>

<script>
// iSmile ERP demo runtime. build_demo.py inlines it into demo.html BEFORE the smoke tests' stub client
// (erp/backend/tests/ui/mock_supabase_erp.js, reused as is) and BEFORE the app. It:
//  - gives the stub an in-memory control store (window.__ERP_DEMO.store: nothing goes to browser storage),
//  - replaces the stub's test fixtures with the demo seed (window.__ERP_DEMO_SEED = seed_demo.json),
//  - adds a small stock ledger (per warehouse quantity + value at average cost) behind on hand, stock card, item lookup,
//    negative-stock report and alerts, so goods receipts, consumption, transfers and adjustments move the numbers,
//  - numbers posted documents per series (TYPE-BRANCH/000001, OPN/000001),
//  - draws the "DEMO" banner with a role switcher (sign-out + sign-in as another demo member, no reload).
// Everything lives in this page's memory: a reload starts again from the seed.
(function () {
  'use strict';
  var SEED = window.__ERP_DEMO_SEED;
  var USERS = SEED.users, CUR = USERS[0];
  var store = {mock_session: '1', mock_role: CUR.role};
  function pad(n, w) { return String(n).padStart(w || 2, '0'); }
  function isoDay(n) { var d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() - (n || 0)); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  var TODAY = isoDay(0);
  function r2(n) { return Math.round(n * 100 + (n >= 0 ? 1e-9 : -1e-9)) / 100; }
  function r4(n) { return Math.round(n * 10000) / 10000; }
  function q4(n) { return Number(n).toFixed(4); }
  function by(arr, k, v) { for (var i = 0; i < arr.length; i++) if (arr[i][k] === v) return arr[i]; return null; }
  function fill(arr, rows) { arr.length = 0; rows.forEach(function (r) { arr.push(r); }); }
  function clear(o) { Object.keys(o).forEach(function (k) { delete o[k]; }); }
  function eanOk(b) {
    if (!/^\d{8}$|^\d{12,14}$/.test(b)) return false;
    var d = b.split('').map(Number), c = d.pop(), s = 0;
    d.reverse().forEach(function (x, i) { s += x * (i % 2 ? 1 : 3); });
    return (10 - s % 10) % 10 === c;
  }
  var M, H, X;                 // the stub's api, its handlers, its data arrays
  var BAL = {}, MOVES = [], MOVEID = 0, RESOLVED = {};
  window.__ERP_DEMO = {store: store, hook: hook};
  window.__erpDemo = {switchTo: switchTo, user: function () { return CUR; }, balance: function (wh, code) {
    var w = by(X.WHS.concat(X.TRANSIT), 'code', wh), it = by(X.ITEMS, 'code', code); var b = w && it && BAL[w.warehouse_id + '|' + it.item_id]; return b ? b.qty : 0; }};

/* ---------- config ---------- */
// Same Supabase project / Auth as the CRM (05 question 1, default). The publishable key is public by design;
// no secret, provider key or service-role key ever appears in a front-end file.
var SB_URL = 'https://demo.invalid', SB_KEY = 'demo-no-key';   // demo build: no project, no key
var API_TIMEOUT_MS = 8000;
var arrivedByLink = /[#&]type=(invite|recovery|signup)/.test(location.hash);
var sb = window.supabase.createClient(SB_URL, SB_KEY, {auth: {persistSession: true, autoRefreshToken: true, detectSessionInUrl: true}});

/* ---------- helpers ---------- */
function has(o, k) { return Object.prototype.hasOwnProperty.call(o, k); }
function t(k, p) {
  var s = has(STR, k) ? STR[k] : k;
  if (p) s = s.replace(/\{(\w+)\}/g, function (m, n) { return p[n] == null ? '' : String(p[n]); });
  return s;
}
function $(id) { return document.getElementById(id); }
function val(id) { var e = $(id); return e ? e.value : ''; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); }
function uuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  var b = new Uint8Array(16); crypto.getRandomValues(b); b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  var h = Array.prototype.map.call(b, function (x) { return (x + 256).toString(16).slice(1); }).join('');
  return h.slice(0, 8) + '-' + h.slice(8, 12) + '-' + h.slice(12, 16) + '-' + h.slice(16, 20) + '-' + h.slice(20);
}
// dates: the server speaks ISO yyyy-mm-dd, the page shows dd/mm/yyyy
function fmtDate(iso) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ''); return m ? m[3] + '/' + m[2] + '/' + m[1] : ''; }
function parseDate(s) {
  var m = /^\s*(\d{1,2})\/(\d{1,2})\/(\d{4})\s*$/.exec(s || ''); if (!m) return null;
  var d = new Date(Date.UTC(+m[3], +m[2] - 1, +m[1]));
  if (d.getUTCDate() !== +m[1] || d.getUTCMonth() !== +m[2] - 1) return null;
  return d.toISOString().slice(0, 10);
}
function eur(n) { return '€' + (Number(n) || 0).toLocaleString('en-GB', {minimumFractionDigits: 2, maximumFractionDigits: 2}); }

/* ---------- api ---------- */
// Every server call goes through api(): erp_api schema only (no table reads from the page), idempotency key on
// writes, 8 s timeout, error code mapping. Reply: {ok, data, error: {code, text, message, detail}}.
function mapError(e) {
  var msg = (e && e.message) || '';
  var m = /^(ERP_[A-Z_]+):\s*([\s\S]*)$/.exec(msg);
  var code = m ? m[1] : (e && e.code === 'PGRST202' ? 'ERP_RPC_MISSING' : 'ERP_NETWORK');
  var detail = null;
  if (e && e.details) { try { detail = JSON.parse(e.details); } catch (x) { detail = e.details; } }
  var text = has(STR, 'err.' + code) ? t('err.' + code) : (m ? m[2] : (msg || t('err.unknown')));
  return {code: code, text: text, message: msg, detail: detail};
}
async function api(name, args, opts) {
  opts = opts || {};
  var a = Object.assign({}, args || {});
  if (opts.write && !a.p_idempotency_key) a.p_idempotency_key = opts.key || uuid();
  var timer, r;
  var timeout = new Promise(function (res) { timer = setTimeout(function () { res({data: null, error: {message: 'ERP_TIMEOUT: timeout'}}); }, API_TIMEOUT_MS); });
  try { r = await Promise.race([sb.schema('erp_api').rpc(name, a), timeout]); }
  catch (e) { r = {data: null, error: {message: String((e && e.message) || e)}}; }
  finally { clearTimeout(timer); }
  if (r.error) return {ok: false, data: null, error: mapError(r.error)};
  return {ok: true, data: r.data, error: null};
}

/* ---------- app frame: nav, routing, role guard ---------- */
// A screen: {id, nav: string key or null, caps: [any of these capabilities opens it], render(sub) -> html, mount(sub)}.
// Menus and buttons come from whoami().caps; hiding is never the security control (the server checks every call).
var SCREENS = [];
function screen(def) { SCREENS.push(def); }
function can(cap) { return !!(S.me && S.me.caps && S.me.caps.indexOf(cap) >= 0); }
function canAny(caps) { return !caps || !caps.length || caps.some(can); }
function screenDef(id) { for (var i = 0; i < SCREENS.length; i++) if (SCREENS[i].id === id) return SCREENS[i]; return null; }
function viewApp() {
  var me = S.me, cur = (S.route && S.route.id) || 'home';
  var nav = SCREENS.filter(function (d) { return d.nav && canAny(d.caps); }).map(function (d) {
    return '<a href="#/' + esc(d.id) + '" data-act="go" data-to="' + esc(d.id) + '" class="' + (d.id === cur ? 'on' : '') + '">' + esc(t(d.nav)) + '</a>';
  }).join('');
  return '<div class="top"><span class="brand">' + esc(me.tenant.name) + '</span><nav id="nav">' + nav + '</nav><span class="grow"></span>' +
    '<span class="muted">' + esc(me.email) + '</span><button data-act="signout">' + esc(t('app.signout')) + '</button></div>' +
    '<div class="main" id="main"></div>';
}
function parseRoute() {
  var parts = (location.hash || '').replace(/^#\/?/, '').split('/').filter(Boolean);
  return {id: parts[0] || 'home', sub: parts.slice(1)};
}
function mountApp() { route(); }
function route() {
  var r = parseRoute(), def = screenDef(r.id);
  if (!def) { r = {id: 'home', sub: []}; def = screenDef('home'); }
  if (!canAny(def.caps)) {
    toast(t('guard.not_allowed'));
    r = {id: 'home', sub: []}; def = screenDef('home');
    try { history.replaceState(null, '', '#/home'); } catch (x) {}
  }
  S.route = r;
  var navEl = $('nav');
  if (navEl) Array.prototype.forEach.call(navEl.querySelectorAll('a'), function (a) { a.className = a.getAttribute('data-to') === r.id ? 'on' : ''; });
  $('main').innerHTML = def.render(r.sub);
  if (def.mount) def.mount(r.sub);
}
function go(hash) { if (location.hash === hash) route(); else location.hash = hash; }
ACT.go = function (el) { guardDrawer(function () { go('#/' + el.getAttribute('data-to') + (el.getAttribute('data-sub') ? '/' + el.getAttribute('data-sub') : '')); }); };
window.addEventListener('hashchange', function () { if (S.screen === 'app') { if (D) drawerClose(true); route(); } });

// RFC 4180 style: quoted fields with "" escapes and line breaks, BOM removed; separator = the most frequent of ; , TAB
// in the first line. Returns an array of rows (arrays of strings); empty lines are dropped.
function parseCsv(text) {

  seps.forEach(function (c) { var n = first.split(c).length; if (n > best) { best = n; sep = c; } });
  var rows = [], row = [], f = '', q = false, i, ch;
  for (i = 0; i < text.length; i++) {
    ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; continue; }
    if (ch === '"' && f === '') q = true;
    else if (ch === sep) { row.push(f); f = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(f); f = ''; rows.push(row); row = []; }
    else f += ch;
  }

}

  var head = rows[0].map(function (h) { return String(h).trim().toLowerCase().replace(/\s+/g, '_'); });
  var ignored = head.filter(function (h) { return h && allowed.indexOf(h) < 0; });

    var o = {}; head.forEach(function (h, i) { if (allowed.indexOf(h) >= 0 && r[i] != null && String(r[i]).trim() !== '') o[h] = String(r[i]).trim(); }); return o;
  })};
}

  }).join('') + '</div>';
}
function pickedBranches() { return Array.prototype.map.call(document.querySelectorAll('input[name=m-br]:checked'), function (x) { return x.value; }); }
function memberForm(m, isNew) {
  var ro = !can('member.manage');
  var roleOpts = ROLES.map(function (r) { return [r, t('role.' + r)]; });
  return (isNew ? field('m-email', 'members.f.email', inp('m-email', '', 'email')) : '<p><b>' + esc(m.email) + '</b> ' + statusBadge(m.status) + '</p><p class="muted">' +
      esc(m.bound_at ? t('members.bound', {date: fmtDate(m.bound_at)}) : t('members.not_bound')) + '</p>') +
    field('m-name', 'members.f.name', inp('m-name', m.display_name, 'text', ro)) +
    field('m-role', 'members.f.role', sel('m-role', roleOpts, m.role || 'clinic_user', ro)) +
    '<label>' + esc(t('members.f.branches')) + '</label>' + branchChips(m.branch_ids || [], ro) +
    chk('m-all', 'members.f.all_branches', m.all_branches, ro) +
    (isNew ? '<p class="muted">' + esc(t('members.invite_note')) + '</p>' : chk('m-active', 'members.f.active', m.active, ro));
}
ACT['member-new'] = function () {
  drawerOpen({title: t('members.drawer.invite'), body: function () { return memberForm({branch_ids: [], role: 'clinic_user'}, true); },
    save: function () {
      var p = {email: val('m-email').trim(), role: val('m-role'), branch_ids: pickedBranches(), all_branches: $('m-all').checked};
      var nm = val('m-name').trim(); if (nm) p.display_name = nm;
      return api('member_invite', {p_member: p}, {write: true, key: D.key});
    },
    onSaved: function () { membersLoad(true); }});
};
ACT['member-open'] = function (el) {
  var m = ADM.rows.find(function (x) { return x.member_id === el.getAttribute('data-id'); }); if (!m) return;
  var mine = S.me && m.member_id === S.me.member_id;
  drawerOpen({title: t('members.drawer.edit'), readOnly: !can('member.manage'),
    extra: can('member.manage') && m.status === 'active' && !mine ? '<button data-act="member-reset" data-id="' + esc(m.member_id) + '">' + esc(t('members.reset_binding')) + '</button>' : '',
    body: function () { return memberForm(m, false); },
    save: function () {
      var c = {}, nm = val('m-name').trim() || null, br = pickedBranches().sort(), old = (m.branch_ids || []).slice().sort();
      if (nm !== (m.display_name || null)) c.display_name = nm;
      if (val('m-role') !== m.role) c.role = val('m-role');
      if (br.join() !== old.join()) c.branch_ids = br;
      if ($('m-all').checked !== !!m.all_branches) c.all_branches = $('m-all').checked;
      if ($('m-active').checked !== !!m.active) c.active = $('m-active').checked;
      if (!Object.keys(c).length) return Promise.resolve({ok: true, data: m});
      return api('member_update', {p_member_id: m.member_id, p_changes: c}, {write: true, key: D.key});
    },
    onSaved: function () { membersLoad(true); }});
};
ACT['member-reset'] = function (el) {
  var m = ADM.rows.find(function (x) { return x.member_id === el.getAttribute('data-id'); }); if (!m) return;
  confirmBox(t('members.reset_confirm', {email: m.email}), t('members.reset_binding'), t('cancel'), async function () {
    var r = await api('member_reset_binding', {p_member_id: m.member_id}, {write: true});
    if (!r.ok || r.data == null) { drawerMsg(notSaved(r), r.error && Array.isArray(r.error.detail) ? r.error.detail : null); return; }
    drawerClose(true); toast(t('members.reset_done')); membersLoad(true);
  });
};

/* ---------- admin: branches ---------- */
async function branchesLoad() {
  var r = await loadBranches();
  if (ADM.tab !== 'branches') return;
  if (!r.ok) { admError(r); return; }
  var rows = ADM.branches.length ? ADM.branches.map(function (b) {
    return '<tr class="click" data-act="branch-open" data-id="' + esc(b.branch_id) + '"><td>' + esc(b.code) + '</td><td>' + esc(b.name) + '</td><td>' +
      esc(b.establishment_no == null ? '' : b.establishment_no) + '</td><td><span class="badge ' + (b.active ? 'good' : '') + '">' + esc(t(b.active ? 'branches.active' : 'branches.inactive')) + '</span></td></tr>';
  }).join('') : '<tr><td colspan="4" class="empty">' + esc(t('list.empty')) + '</td></tr>';
  admBody('<div class="row end" style="margin-bottom:10px">' + (can('branch.write') ? '<button class="primary" data-act="branch-new">' + esc(t('branches.add')) + '</button>' : '') + '</div>' +
    '<div class="tbl-wrap"><table id="b-table"><thead><tr><th>' + esc(t('branches.col.code')) + '</th><th>' + esc(t('branches.col.name')) + '</th><th>' +
    esc(t('branches.col.establishment')) + '</th><th>' + esc(t('branches.col.status')) + '</th></tr></thead><tbody>' + rows + '</tbody></table></div>');
}
function branchForm(b) {
  var ro = !can('branch.write');
  return field('b-code', 'branches.f.code', inp('b-code', b.code, 'text', ro)) + field('b-name', 'branches.f.name', inp('b-name', b.name, 'text', ro)) +
    field('b-estab', 'branches.f.establishment', inp('b-estab', b.establishment_no, 'number', ro)) + field('b-addr', 'branches.f.address', inp('b-addr', b.address, 'text', ro)) +
    chk('b-active', 'branches.f.active', b.active !== false, ro);
}
function branchDrawer(b) {
  var isNew = !b.branch_id;
  drawerOpen({title: t(isNew ? 'branches.drawer.new' : 'branches.drawer.edit'), readOnly: !can('branch.write'), body: function () { return branchForm(b); },
    save: function () {
      var p = isNew ? {} : {branch_id: b.branch_id}, est = val('b-estab').trim();
      var v = {code: val('b-code').trim(), name: val('b-name').trim(), establishment_no: est === '' ? null : est, address: val('b-addr').trim() || null, active: $('b-active').checked};
      Object.keys(v).forEach(function (k) { var o = b[k] == null ? null : (k === 'establishment_no' ? String(b[k]) : b[k]); if (isNew || v[k] !== o) p[k] = v[k]; });
      if (!isNew && Object.keys(p).length === 1) return Promise.resolve({ok: true, data: b});
      return api('branch_save', {p_branch: p}, {write: true, key: D.key});
    },
    onSaved: async function () { await refreshMe(); branchesLoad(); }});
}
ACT['branch-new'] = function () { branchDrawer({active: true}); };
ACT['branch-open'] = function (el) { var b = ADM.branches.find(function (x) { return x.branch_id === el.getAttribute('data-id'); }); if (b) branchDrawer(b); };

/* ---------- admin: settings ---------- */
function zones(cur) {
  var z = [];
  try { z = Intl.supportedValuesOf('timeZone'); } catch (x) { z = []; }
  if (z.indexOf(cur) < 0) z = [cur].concat(z);
  return z.map(function (x) { return [x, x]; });
}
async function settingsLoad() {
  var r = await api('settings_get');
  if (ADM.tab !== 'settings') return;
  if (!r.ok) { admError(r); return; }
  var s = ADM.settings = r.data, ro = !s.can_write;
  admBody('<div class="card" style="max-width:560px"><form data-form="settings" id="s-form">' +
    (ro ? '<p class="muted">' + esc(t('settings.read_only')) + '</p>' : '') +
    field('s-tz', 'settings.f.time_zone', sel('s-tz', zones(s.time_zone), s.time_zone, ro)) +
    field('s-neg', 'settings.f.negative_stock', sel('s-neg', [['warn', t('settings.neg.warn')], ['block', t('settings.neg.block')]], s.negative_stock, ro)) +
    field('s-val', 'settings.f.valuation', inp('s-val', t('settings.val.' + s.valuation_method), 'text', true)) + '<p class="muted">' + esc(t('settings.val_note')) + '</p>' +
    field('s-lock', 'settings.f.lock_date', inp('s-lock', fmtDate(s.lock_date), 'text', ro)) +
    chk('s-hide', 'settings.f.hide_money', s.hide_money, ro) +
    field('s-explim', 'settings.f.exp_limit', inp('s-explim', (s.thresholds || {}).exp_value != null ? s.thresholds.exp_value : '', 'text', ro)) +
    field('s-logo', 'settings.f.logo_url', inp('s-logo', s.logo_url, 'url', ro)) +
    '<div class="msg bad" id="s-msg"></div>' +
    (ro ? '' : '<div class="row end"><button type="submit" class="primary" id="s-save">' + esc(t('settings.save')) + '</button></div>') + '</form></div>');
}
FORM.settings = async function () {
  var s = ADM.settings, b = $('s-save'), msg = $('s-msg'); if (!s || !b || b.disabled) return;
  var lockTxt = val('s-lock').trim(), lock = lockTxt ? parseDate(lockTxt) : null;
  if (lockTxt && !lock) { msg.textContent = t('save.not_saved', {reason: t('settings.lock_invalid')}); return; }
  var p = {version: s.version};
  if (val('s-tz') !== s.time_zone) p.time_zone = val('s-tz');
  if (val('s-neg') !== s.negative_stock) p.negative_stock = val('s-neg');
  if (lock !== (s.lock_date || null)) p.lock_date = lock;
  if ($('s-hide').checked !== !!s.hide_money) p.hide_money = $('s-hide').checked;
  var logo = val('s-logo').trim() || null; if (logo !== (s.logo_url || null)) p.logo_url = logo;
  var limTxt = val('s-explim').trim().replace(',', '.'), lim = limTxt === '' ? null : Number(limTxt), thr = Object.assign({}, s.thresholds || {});
  if (limTxt !== '' && (isNaN(lim) || lim < 0)) { msg.textContent = t('save.not_saved', {reason: t('settings.exp_limit_invalid')}); return; }
  if (lim !== (thr.exp_value != null ? Number(thr.exp_value) : null)) { if (lim === null) delete thr.exp_value; else thr.exp_value = lim; p.thresholds = thr; }
  b.disabled = true; b.textContent = t('drawer.saving'); msg.textContent = '';
  var r = await api('settings_save', {p_settings: p}, {write: true, key: ADM.settingsKey || (ADM.settingsKey = uuid())});
  b.disabled = false; b.textContent = t('settings.save');
  if (!r.ok || r.data == null) {
    msg.innerHTML = esc(notSaved(r)) + (r.error && Array.isArray(r.error.detail) ? '<ul class="problems">' + r.error.detail.map(function (x) { return '<li>' + esc(x.message) + '</li>'; }).join('') + '</ul>' : '');
    return;
  }
  ADM.settingsKey = null; toast(t('save.saved')); await refreshMe(); settingsLoad();
};
/* ===== 99_boot.js ===== */
/* ---------- boot (last file: every screen is registered before the first render) ---------- */
var linkDone = false;
sb.auth.onAuthStateChange(function (ev, sess) {
  setTimeout(async function () {
    if (ev === 'PASSWORD_RECOVERY' || (ev === 'SIGNED_IN' && arrivedByLink && !linkDone && S.screen !== 'app')) { linkDone = true; S.screen = 'setpw'; S.msg = ''; render(); return; }
    if (ev === 'SIGNED_OUT' || (ev === 'INITIAL_SESSION' && !sess)) { if (D) drawerClose(true); S.me = null; S.msg = ''; S.screen = 'login'; render(); return; }
    if ((ev === 'SIGNED_IN' || ev === 'INITIAL_SESSION') && sess && S.screen !== 'app' && S.screen !== 'setpw') await enter();
  }, 0);
});
render();
})();
</script>
