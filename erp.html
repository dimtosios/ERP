<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ERP</title>
<style>
/* ERP page styles. Same colour logic as the CRM page, own file; system fonts only (no font CDN). */
:root{
  --bg:#EEF2F4; --surface:#FFFFFF; --surface2:#F6F8F9; --ink:#14212B; --muted:#5C6B77; --line:#D8E0E5;
  --accent:#2F5D8A; --accent-ink:#FFFFFF; --accent-soft:#E1EAF3;
  --good:#1E8E5A; --warn:#B7791F; --bad:#C0392B; --warn-soft:#FBF0D9; --bad-soft:#F9E1DE; --good-soft:#DCF2E6;
  --shadow:0 1px 2px rgba(20,33,43,.08),0 4px 14px rgba(20,33,43,.06);
  --font:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F171D; --surface:#17222A; --surface2:#1D2B34; --ink:#E6EDF1; --muted:#93A4B0; --line:#2B3B46;
  --accent:#7FA8D1; --accent-ink:#0A1622; --accent-soft:#1B2E40;
  --good:#4CC38A; --warn:#E0A94A; --bad:#EE7A6C; --warn-soft:#3A2F17; --bad-soft:#40201C; --good-soft:#153427;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F171D; --surface:#17222A; --surface2:#1D2B34; --ink:#E6EDF1; --muted:#93A4B0; --line:#2B3B46;
  --accent:#7FA8D1; --accent-ink:#0A1622; --accent-soft:#1B2E40;
  --good:#4CC38A; --warn:#E0A94A; --bad:#EE7A6C; --warn-soft:#3A2F17; --bad-soft:#40201C; --good-soft:#153427;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45}
h1,h2,h3{margin:0;font-weight:600}
h1{font-size:20px} h2{font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.link{border:0;background:none;color:var(--accent);padding:4px 6px}
button:disabled{opacity:.55;cursor:default}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 9px}
input[type=checkbox]{width:auto}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
label.check{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px}
.muted{color:var(--muted)}
.msg{margin:10px 0;padding:8px 10px;border-radius:8px;background:var(--warn-soft)}
.msg.bad{background:var(--bad-soft)} .msg.good{background:var(--good-soft)}
.msg:empty{display:none}
.center{max-width:380px;margin:12vh auto 0;padding:0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow)}
.card h1{margin-bottom:6px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.grow{flex:1}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.top .brand{font-weight:600}
.top nav{display:flex;gap:4px;flex-wrap:wrap}
.top nav a{padding:6px 10px;border-radius:8px;color:var(--ink);text-decoration:none}
.top nav a.on{background:var(--accent-soft);color:var(--accent)}
.main{padding:16px;max-width:1200px;margin:0 auto}
.tabs{display:flex;gap:4px;margin:0 0 12px;flex-wrap:wrap}
.tabs a{padding:6px 10px;border-radius:8px;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface)}
.tabs a.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
tr.click{cursor:pointer} tr.click:hover{background:var(--surface2)}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;background:var(--surface2);border:1px solid var(--line)}
.badge.good{background:var(--good-soft)} .badge.warn{background:var(--warn-soft)} .badge.bad{background:var(--bad-soft)}
.empty{padding:24px;text-align:center;color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(10,20,30,.35);z-index:10}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:11;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.drawer header{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.drawer .body{flex:1;overflow:auto;padding:4px 16px 16px}
.drawer footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line)}
.modal{position:fixed;left:50%;top:30%;transform:translateX(-50%);width:min(420px,calc(100% - 32px));z-index:21;background:var(--surface);border-radius:12px;padding:18px;box-shadow:var(--shadow)}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,30,.35);z-index:20}
.problems{margin:6px 0 0 18px;padding:0}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:30}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{display:flex;gap:6px;align-items:center;margin:0;padding:4px 8px;border:1px solid var(--line);border-radius:999px;color:var(--ink);font-size:13px}
/* stock (T14) */
.neg{color:var(--bad);font-weight:600}
.dline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.dline .dl-item{flex:1 1 220px;min-width:0}
.dline .dl-item .dl-name{display:block;font-size:12px;margin-top:2px}
.dline input.dl-qty,.dline input.dl-price,.dline input.dl-disc{width:96px}
.dline input.dl-ref{width:140px}
.dline .dl-amt{min-width:80px;text-align:right}
.dline input.rc-reason{flex:1 1 180px;min-width:0}
.drawer footer{flex-wrap:wrap}
@media (max-width:600px){.top{padding:8px 12px}.main{padding:12px}
  .dline input.dl-qty,.dline input.dl-price,.dline input.dl-disc{width:calc(33% - 6px)}}
</style>

/* ---------- api ---------- */
// Every server call goes through api(): erp_api schema only (no table reads from the page), idempotency key on
// writes, 8 s timeout, error code mapping. Reply: {ok, data, error: {code, text, message, detail}}.
function mapError(e) {
  var msg = (e && e.message) || '';
  var m = /^(ERP_[A-Z_]+):\s*([\s\S]*)$/.exec(msg);
  var code = m ? m[1] : (e && e.code === 'PGRST202' ? 'ERP_RPC_MISSING' : 'ERP_NETWORK');
  var detail = null;
  if (e && e.details) { try { detail = JSON.parse(e.details); } catch (x) { detail = e.details; } }
  var text = has(STR, 'err.' + code) ? t('err.' + code) : (m ? m[2] : (msg || t('err.unknown')));
  return {code: code, text: text, message: msg, detail: detail};
}
async function api(name, args, opts) {
  opts = opts || {};
  var a = Object.assign({}, args || {});
  if (opts.write && !a.p_idempotency_key) a.p_idempotency_key = opts.key || uuid();
  var timer, r;
  var timeout = new Promise(function (res) { timer = setTimeout(function () { res({data: null, error: {message: 'ERP_TIMEOUT: timeout'}}); }, API_TIMEOUT_MS); });
  try { r = await Promise.race([sb.schema('erp_api').rpc(name, a), timeout]); }
  catch (e) { r = {data: null, error: {message: String((e && e.message) || e)}}; }
  finally { clearTimeout(timer); }
  if (r.error) return {ok: false, data: null, error: mapError(r.error)};
  return {ok: true, data: r.data, error: null};
}

/* ---------- CSV (imports) ---------- */
// RFC 4180 style: quoted fields with "" escapes and line breaks, BOM removed; separator = the most frequent of ; , TAB
// in the first line. Returns an array of rows (arrays of strings); empty lines are dropped.
function parseCsv(text) {
  text = String(text || '').replace(/^\uFEFF/, '');
  var first = text.split(/\r?\n/, 1)[0] || '', seps = [';', ',', '\t'], sep = ';', best = -1;
  seps.forEach(function (c) { var n = first.split(c).length; if (n > best) { best = n; sep = c; } });
  var rows = [], row = [], f = '', q = false, i, ch;
  for (i = 0; i < text.length; i++) {
    ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; continue; }
    if (ch === '"' && f === '') q = true;
    else if (ch === sep) { row.push(f); f = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(f); f = ''; rows.push(row); row = []; }
    else f += ch;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows.filter(function (r) { return r.some(function (x) { return String(x).trim() !== ''; }); });
}
// header row -> objects with the allowed columns only (header names: lower case, spaces to _); reports the others
function csvObjects(text, allowed) {
  var rows = parseCsv(text); if (!rows.length) return {rows: [], ignored: [], header: []};
  var head = rows[0].map(function (h) { return String(h).trim().toLowerCase().replace(/\s+/g, '_'); });
  var ignored = head.filter(function (h) { return h && allowed.indexOf(h) < 0; });
  return {header: head, ignored: ignored, rows: rows.slice(1).map(function (r) {
    var o = {}; head.forEach(function (h, i) { if (allowed.indexOf(h) >= 0 && r[i] != null && String(r[i]).trim() !== '') o[h] = String(r[i]).trim(); }); return o;
  })};
}

// drawerOpen({title, body() -> html, save: async () -> api reply | {local: problems}, onSaved(data), readOnly})
// Save: button disabled while running; "Not saved: <reason>" on an error OR an empty reply; problems listed;

    '<footer>' + (d.extra || '') + (d.save && !d.readOnly ? '<button class="primary" id="d-save" data-act="drawer-save">' + esc(t('drawer.save')) + '</button>' : '') + '</footer></div>';
  if (d.mount) d.mount();

}

  D = null; $('layer').innerHTML = '';
}

function drawerMsg(text, problems) {

function notSaved(r) {

}
ACT['drawer-close'] = function () { drawerClose(false); };
ACT['drawer-save'] = async function () {

  d.busy = true; b.disabled = true; b.textContent = t('drawer.saving'); drawerMsg('');
  var r;

  if (D !== d) return;

  if (!r || !r.ok || r.data == null) { drawerMsg(notSaved(r), r && r.error && Array.isArray(r.error.detail) ? r.error.detail : null); return; }

    field('s-neg', 'settings.f.negative_stock', sel('s-neg', [['warn', t('settings.neg.warn')], ['block', t('settings.neg.block')]], s.negative_stock, ro)) +
    field('s-val', 'settings.f.valuation', inp('s-val', t('settings.val.' + s.valuation_method), 'text', true)) + '<p class="muted">' + esc(t('settings.val_note')) + '</p>' +
    field('s-lock', 'settings.f.lock_date', inp('s-lock', fmtDate(s.lock_date), 'text', ro)) +
    chk('s-hide', 'settings.f.hide_money', s.hide_money, ro) +
    field('s-logo', 'settings.f.logo_url', inp('s-logo', s.logo_url, 'url', ro)) +
    '<div class="msg bad" id="s-msg"></div>' +
    (ro ? '' : '<div class="row end"><button type="submit" class="primary" id="s-save">' + esc(t('settings.save')) + '</button></div>') + '</form></div>');
}
FORM.settings = async function () {
  var s = ADM.settings, b = $('s-save'), msg = $('s-msg'); if (!s || !b || b.disabled) return;
  var lockTxt = val('s-lock').trim(), lock = lockTxt ? parseDate(lockTxt) : null;
  if (lockTxt && !lock) { msg.textContent = t('save.not_saved', {reason: t('settings.lock_invalid')}); return; }
  var p = {version: s.version};
  if (val('s-tz') !== s.time_zone) p.time_zone = val('s-tz');
  if (val('s-neg') !== s.negative_stock) p.negative_stock = val('s-neg');
  if (lock !== (s.lock_date || null)) p.lock_date = lock;
  if ($('s-hide').checked !== !!s.hide_money) p.hide_money = $('s-hide').checked;
  var logo = val('s-logo').trim() || null; if (logo !== (s.logo_url || null)) p.logo_url = logo;
  b.disabled = true; b.textContent = t('drawer.saving'); msg.textContent = '';
  var r = await api('settings_save', {p_settings: p}, {write: true, key: ADM.settingsKey || (ADM.settingsKey = uuid())});
  b.disabled = false; b.textContent = t('settings.save');
  if (!r.ok || r.data == null) {
    msg.innerHTML = esc(notSaved(r)) + (r.error && Array.isArray(r.error.detail) ? '<ul class="problems">' + r.error.detail.map(function (x) { return '<li>' + esc(x.message) + '</li>'; }).join('') + '</ul>' : '');
    return;
  }
  ADM.settingsKey = null; toast(t('save.saved')); await refreshMe(); settingsLoad();
};

/* ---------- boot (last file: every screen is registered before the first render) ---------- */
var linkDone = false;
sb.auth.onAuthStateChange(function (ev, sess) {
  setTimeout(async function () {
    if (ev === 'PASSWORD_RECOVERY' || (ev === 'SIGNED_IN' && arrivedByLink && !linkDone && S.screen !== 'app')) { linkDone = true; S.screen = 'setpw'; S.msg = ''; render(); return; }
    if (ev === 'SIGNED_OUT' || (ev === 'INITIAL_SESSION' && !sess)) { if (D) drawerClose(true); S.me = null; S.msg = ''; S.screen = 'login'; render(); return; }
    if ((ev === 'SIGNED_IN' || ev === 'INITIAL_SESSION') && sess && S.screen !== 'app' && S.screen !== 'setpw') await enter();
  }, 0);
});
render();
})();
